name: Sync release links
on:
  push:
    branches: [main]
    paths: [.github/workflows/sync-release-links.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Point release links at the current repository owner
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          repository = os.environ['GITHUB_REPOSITORY']
          owner, name = repository.split('/', 1)
          api = os.environ['GITHUB_API_URL'] + '/repos/' + repository
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def request(path, body=None):
              payload = None if body is None else json.dumps(body).encode('utf-8')
              req = urllib.request.Request(api + path, data=payload, headers=headers, method='GET' if body is None else 'PATCH')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          pattern = re.compile(r'(https://github[.]com/)([^/\s)<>]+)(/' + re.escape(name) + r')(?=[/#?\s)]|$)', re.IGNORECASE)
          page, changed = 1, 0
          while True:
              releases = request('/releases?per_page=100&page=' + str(page))
              for release in releases:
                  body = release.get('body') or ''
                  updated = pattern.sub(lambda match: match[1] + owner + match[3], body)
                  if updated != body:
                      request('/releases/' + str(release['id']), {'body': updated})
                      changed += 1
                      print('Updated release:', release['tag_name'])
              if len(releases) < 100:
                  break
              page += 1
          print('Release descriptions updated:', changed)
          PY
